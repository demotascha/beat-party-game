<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📸 玩家報名與應援 | 2026 節奏挑戰</title>
  <link rel="stylesheet" href="style.css?v=2026">
  <style>
    *, *::before, *::after {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select, .btn, .emoji-send-btn, .sabotage-btn, .join-card {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .join-card {
      background: var(--bg-card);
      border: 2px solid rgba(0, 255, 136, 0.35);
      border-radius: 22px;
      padding: 20px;
      width: 94%;
      max-width: 460px;
      margin: 14px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.25s ease;
    }
    .join-card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .join-card-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .join-card.collapsed .join-card-body {
      display: none;
    }
    .join-preview {
      width: 185px;
      height: 185px;
      border-radius: 28px;
      border: 3px dashed var(--neon-green);
      background: #14182b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .join-preview.converting {
      animation: pulse3dConvert 0.7s infinite alternate;
      border-style: solid;
      border-color: var(--neon-yellow);
    }
    .join-preview.done-3d {
      border-style: solid;
      border-color: var(--neon-yellow);
      box-shadow: 0 0 28px rgba(255, 230, 0, 0.55);
      animation: pop3dDone 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pulse3dConvert {
      from { transform: scale(0.96) rotate(-2deg); box-shadow: 0 0 10px var(--neon-blue); }
      to   { transform: scale(1.04) rotate(2deg);  box-shadow: 0 0 30px var(--neon-yellow); }
    }
    @keyframes pop3dDone {
      0%   { transform: scale(0.8); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .join-preview img { width: 100%; height: 100%; object-fit: cover; }
    .join-field { width: 100%; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; }
    .join-input, .join-select {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: rgba(0, 0, 0, 0.45); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); font-size: 16px; font-weight: 700;
    }
    .join-group-row { display: flex; gap: 10px; width: 100%; }
    .join-group-row .btn { flex: 1; justify-content: center; padding: 12px; font-size: 15px; }

    /* 當上方造型卡片摺疊時，自動放大應援與干擾按鈕 */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      width: 100%;
      transition: all 0.25s ease;
    }
    .emoji-send-btn {
      font-size: 24px;
      justify-content: center;
      padding: 8px;
      transition: all 0.2s ease;
    }
    .sabotage-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }
    .sabotage-btn {
      justify-content: center;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 12px;
      background: rgba(255, 0, 127, 0.16);
      border: 1px solid rgba(255, 0, 127, 0.5);
    }
    .taunt-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
    }
    .taunt-btn {
      justify-content: center;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      background: rgba(255, 170, 0, 0.14);
      border: 1px solid rgba(255, 170, 0, 0.45);
      color: #ffdd55;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cheer-card.expanded .emoji-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .cheer-card.expanded .emoji-send-btn {
      font-size: 38px;
      padding: 16px 10px;
      border-radius: 16px;
    }
    .cheer-card.expanded .sabotage-btn {
      padding: 18px 12px;
      font-size: 17px;
      border-width: 2px;
    }
    .cheer-card.expanded .taunt-btn {
      padding: 14px 10px;
      font-size: 15px;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <header class="top-header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <div>
        <div class="brand-title">2026 節奏挑戰 • 玩家互動 <span id="joinRoomBadge" style="font-size:12px;background:rgba(0,255,136,0.2);color:#00ff88;padding:2px 7px;border-radius:6px;border:1px solid #00ff88;letter-spacing:1px;font-family:monospace;">房間: DEFAULT</span></div>
        <div class="brand-subtitle">3D 瑪利歐造型報名 &amp; 即時應援干擾</div>
      </div>
    </div>
    <div style="margin-left:auto;">
      <a href="lobby.html" class="btn" style="padding:6px 10px;font-size:12px;border-color:rgba(255,255,255,0.3);">
        🏠 換房間
      </a>
    </div>
  </header>

  <main class="main-container">
    <!-- 卡片 1：造型上傳卡片 (可摺疊) -->
    <div id="profileCard" class="join-card">
      <div class="join-card-header">
        <div style="font-size:17px;font-weight:900;color:var(--neon-yellow);display:flex;align-items:center;gap:8px;">
          <img id="miniAvatarChip" style="width:32px;height:32px;border-radius:8px;display:none;object-fit:cover;border:1px solid var(--neon-yellow);" alt="" />
        </div>
        <button type="button" id="btnToggleProfile" class="btn" style="padding:6px 12px;font-size:13px;margin-left:auto;">
          🔼 摺疊收起
        </button>
      </div>

      <div class="join-card-body">
        <!-- 1. 選擇組別 -->
        <div class="join-field">
          <label>1. 選擇您的組別</label>
          <div class="join-group-row">
            <button type="button" id="btnJoinAdult" class="btn btn-primary">🧑 大人組 (30人)</button>
            <button type="button" id="btnJoinChild" class="btn">🧒 小孩組 (20人)</button>
          </div>
        </div>

        <!-- 2. 上傳照片 -->
        <div class="join-preview" id="previewBox" title="點擊拍照或選取照片">
          <span id="previewHint" style="color:var(--text-muted);text-align:center;padding:12px;font-size:14px;">
            📷 點此拍照或選照片
          </span>
          <img id="previewImg" style="display:none;" alt="預覽" />
        </div>
        <input type="file" id="joinFileInput" accept="image/*" style="display:none;">

        <div id="joinStatus" style="font-size:15px;font-weight:900;color:var(--neon-green);text-align:center;min-height:20px;"></div>

        <!-- 3. 輸入姓名 -->
        <div class="join-field">
          <label for="joinName">2. 您的稱呼（方便大家看圖喊名字）</label>
          <input type="text" id="joinName" class="join-input" placeholder="例如：小明、阿公、妞妞" maxlength="10">
        </div>

        <div style="display:flex;gap:10px;width:100%;">
          <button type="button" id="btnSubmitJoin" class="btn btn-primary" style="flex:1;justify-content:center;padding:14px;font-size:16px;">
            🚀 送出造型到大螢幕
          </button>
        </div>
      </div>
    </div>

    <!-- 卡片 2：即時互動應援 & 瑪利歐道具干擾區 (摺疊上方卡片後按鈕會自動放大) -->
    <div id="cheerCard" class="join-card cheer-card" style="border-color: rgba(255, 0, 127, 0.45); margin-top: 4px;">
      <div style="font-size:18px;font-weight:900;color:var(--neon-pink);text-align:center;">
        🎉 即時應援 &amp; 😈 瑪利歐道具干擾
      </div>
      <div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:-8px;">
        點擊即可在大螢幕浮動顯示 3 秒，或發動道具干擾正在挑戰的人！
      </div>

      <!-- 快捷 Emoji 按鈕列 -->
      <div id="emojiGrid" class="emoji-grid">
        <button type="button" class="btn emoji-send-btn">🔥</button>
        <button type="button" class="btn emoji-send-btn">🤣</button>
        <button type="button" class="btn emoji-send-btn">👏</button>
        <button type="button" class="btn emoji-send-btn">🍺</button>
        <button type="button" class="btn emoji-send-btn">💖</button>
        <button type="button" class="btn emoji-send-btn">😱</button>
        <button type="button" class="btn emoji-send-btn">🥳</button>
        <button type="button" class="btn emoji-send-btn">💪</button>
        <button type="button" class="btn emoji-send-btn">⚡</button>
        <button type="button" class="btn emoji-send-btn">🎯</button>
        <button type="button" class="btn emoji-send-btn">🐶</button>
        <button type="button" class="btn emoji-send-btn">🐱</button>
      </div>

      <!-- 😈 遊戲干擾道具區 -->
      <div id="sabotageSection" class="join-field" style="margin-top:4px;">
        <label id="sabotageLabel" style="color:var(--neon-yellow);">😈 趣味微干擾！發動 3 秒輕量道具：</label>
        <div class="sabotage-grid">
          <button type="button" class="btn sabotage-btn" data-sabotage="blooper">🦑 墨魚半透明噴墨</button>
          <button type="button" class="btn sabotage-btn" data-sabotage="pow">💥 POW 輕微震動</button>
          <button type="button" class="btn sabotage-btn" data-sabotage="flip">🙃 魔鏡歪頭微晃</button>
          <button type="button" class="btn sabotage-btn" data-sabotage="boo">👻 幽靈薄霧特效</button>
        </div>
      </div>

      <!-- 📢 快捷干擾 & 歡樂喊話字眼 (一鍵發送彈幕) -->
      <div class="join-field" style="margin-top:4px;">
        <label style="color:#ffdd55;display:flex;justify-content:space-between;align-items:center;">
          <span>📢 快捷干擾喊話 (點擊直接大螢幕彈幕)：</span>
        </label>
        <div class="taunt-grid">
          <button type="button" class="btn taunt-btn" data-text="節奏亂掉了啦！🤣">🤪 節奏亂掉了啦！</button>
          <button type="button" class="btn taunt-btn" data-text="你看錯張了啦！👀">👀 你看錯張了啦！</button>
          <button type="button" class="btn taunt-btn" data-text="拍子要跑掉了！⏰">⏰ 拍子要跑掉了！</button>
          <button type="button" class="btn taunt-btn" data-text="手在抖吼～緊張了！🫣">🫣 手在抖吼緊張了！</button>
          <button type="button" class="btn taunt-btn" data-text="這題超難～完了！💥">💥 這題超難完了！</button>
          <button type="button" class="btn taunt-btn" data-text="撐住啊！不要爆掉！🙏">🙏 撐住啊不要爆！</button>
          <button type="button" class="btn taunt-btn" data-text="眼睛閉起來盲猜！🙈">🙈 眼睛閉起來盲猜！</button>
          <button type="button" class="btn taunt-btn" data-text="台下觀眾都在看你！👀✨">✨ 觀眾都在看你喔！</button>
        </div>
      </div>

      <!-- 輸入文字發送 -->
      <div style="display:flex;gap:8px;width:100%;">
        <input type="text" id="barrageTextInput" class="join-input" placeholder="輸入應援或干擾喊話 (最多20字)..." maxlength="20" style="flex:1;">
        <button type="button" id="btnSendText" class="btn btn-primary" style="white-space:nowrap;padding:0 18px;">💬 發送</button>
      </div>

      <!-- 發送自訂 Emoji 圖片 / 貼圖 -->
      <div style="width:100%;">
        <button type="button" id="btnSendImg" class="btn" style="width:100%;justify-content:center;padding:12px;border-color:var(--neon-blue);color:var(--neon-blue);">
          🖼️ 選取手機圖片 / 搞笑貼圖發送到大螢幕
        </button>
        <input type="file" id="barrageImgInput" accept="image/*" style="display:none;">
      </div>

      <!-- 快速再次發送先前自訂貼圖與發送過的文字 -->
      <div id="recentCustomSendSection" style="width:100%;display:flex;flex-direction:column;gap:8px;">
        <div id="recentTextsBox" style="display:none;width:100%;">
          <div style="font-size:12px;color:var(--neon-green);margin-bottom:4px;">🕒 發送過的文字（點擊直接再發送）：</div>
          <div id="recentTextsList" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>
        <div id="recentImgsBox" style="display:none;width:100%;">
          <div style="font-size:12px;color:var(--neon-blue);margin-bottom:4px;">🕒 加入過的自訂貼圖（點擊直接再發送）：</div>
          <div id="recentImgsList" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;"></div>
        </div>
      </div>

      <div id="barrageStatus" style="font-size:13px;font-weight:700;color:var(--neon-yellow);text-align:center;min-height:18px;"></div>
    </div>
  </main>

  <script src="roster.js?v=2026"></script>
  <script>
    let selectedGroup = 'adult';
    let cartoonDataUrl = null;
    let isProfileCollapsed = false;

    const profileCard = document.getElementById('profileCard');
    const cheerCard = document.getElementById('cheerCard');
    const btnToggleProfile = document.getElementById('btnToggleProfile');
    const btnConfirmFold = document.getElementById('btnConfirmFold');
    const miniAvatarChip = document.getElementById('miniAvatarChip');

    const btnAdult = document.getElementById('btnJoinAdult');
    const btnChild = document.getElementById('btnJoinChild');
    const previewBox = document.getElementById('previewBox');
    const previewImg = document.getElementById('previewImg');
    const previewHint = document.getElementById('previewHint');
    const fileInput = document.getElementById('joinFileInput');
    const nameInput = document.getElementById('joinName');
    const statusEl = document.getElementById('joinStatus');

    function setProfileCollapsed(collapsed) {
      isProfileCollapsed = collapsed;
      profileCard.classList.toggle('collapsed', collapsed);
      cheerCard.classList.toggle('expanded', collapsed);
      btnToggleProfile.textContent = collapsed ? '🔽 展開修改造型' : '🔼 摺疊收起';
    }

    btnToggleProfile.onclick = () => setProfileCollapsed(!isProfileCollapsed);

    btnAdult.onclick = () => {
      selectedGroup = 'adult';
      btnAdult.classList.add('btn-primary');
      btnChild.classList.remove('btn-primary');
    };
    btnChild.onclick = () => {
      selectedGroup = 'child';
      btnChild.classList.add('btn-primary');
      btnAdult.classList.remove('btn-primary');
    };

    // 選擇照片後進行壓縮並顯示預覽
    previewBox.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      previewBox.classList.remove('done-3d');
      previewBox.classList.add('converting');
      statusEl.textContent = '⏳ 正在讀取並處理照片...';
      try {
        await new Promise(r => setTimeout(r, 200));
        cartoonDataUrl = await RosterManager.compressImage(file, 240, 0.88);
        previewImg.src = cartoonDataUrl;
        previewImg.style.display = 'block';
        previewHint.style.display = 'none';
        miniAvatarChip.src = cartoonDataUrl;
        miniAvatarChip.style.display = 'inline-block';
        previewBox.classList.remove('converting');
        previewBox.classList.add('done-3d');
        statusEl.textContent = '✨ 照片載入完成！';
      } catch (err) {
        previewBox.classList.remove('converting');
        statusEl.textContent = '❌ 圖片讀取失敗，請換一張試試';
      }
    };

    document.getElementById('btnSubmitJoin').onclick = async () => {
      const name = nameInput.value.trim();
      if (!cartoonDataUrl) { alert('請先點選上方框框拍張照或選擇照片喔！'); return; }
      if (!name) { alert('請輸入您的稱呼！'); return; }
      const btn = document.getElementById('btnSubmitJoin');
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '⏳ 上傳傳送中...';
      statusEl.textContent = '⏳ 正在傳送到主舞台...';

      try {
        const roomId = window.rosterManager ? window.rosterManager.roomId : 'DEFAULT';
        const sid = window.rosterManager ? window.rosterManager.sessionId : 'join_anon';
        const res = await fetch(`/api/join?room=${encodeURIComponent(roomId)}&sid=${encodeURIComponent(sid)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ group: selectedGroup, slotIndex: -1, name, avatar: cartoonDataUrl })
        });
        const data = await res.json();
        if (data.ok) {
          statusEl.textContent = `🎉 報名成功！已排入【${selectedGroup === 'child' ? '小孩組' : '大人組'} #${data.slotId}】`;
          setTimeout(() => setProfileCollapsed(true), 700);
          btn.textContent = '🚀 確認加入 / 更新大螢幕';
          btn.disabled = false;
          return;
        } else {
          statusEl.textContent = '❌ 加入失敗：' + (data.error || '未知錯誤');
        }
      } catch (e) {
        statusEl.textContent = '❌ 網路連線錯誤，請稍後重試';
      }
      btn.textContent = '🚀 確認加入 / 更新大螢幕';
      btn.disabled = false;
    };

    // ===== 即時發送 Emoji / 圖片 / 文字彈幕 / 道具干擾 =====
    const barrageStatus = document.getElementById('barrageStatus');
    const barrageTextInput = document.getElementById('barrageTextInput');
    const barrageImgInput = document.getElementById('barrageImgInput');
    const recentTextsBox = document.getElementById('recentTextsBox');
    const recentTextsList = document.getElementById('recentTextsList');
    const recentImgsBox = document.getElementById('recentImgsBox');
    const recentImgsList = document.getElementById('recentImgsList');

    const joinRoomBadge = document.getElementById('joinRoomBadge');
    const currentRoom = window.rosterManager ? window.rosterManager.roomId : 'DEFAULT';
    if (joinRoomBadge) joinRoomBadge.innerText = `房間: ${currentRoom}`;

    // 本地快取：發送過的文字與加入過的自訂貼圖
    function getStoredItems(key) {
      try { return JSON.parse(sessionStorage.getItem(key) || '[]'); } catch (e) { return []; }
    }
    function saveStoredItem(key, item, max = 8) {
      try {
        let list = getStoredItems(key);
        list = [item, ...list.filter(x => x !== item)].slice(0, max);
        sessionStorage.setItem(key, JSON.stringify(list));
      } catch (e) {}
    }

    function renderRecentSends() {
      // 1. 發送過的文字 (自訂輸入的文字)
      const texts = getStoredItems('beat_recent_texts_' + currentRoom);
      if (texts.length > 0) {
        recentTextsList.innerHTML = '';
        texts.forEach(txt => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn';
          btn.style.cssText = 'padding:6px 12px;font-size:13px;border-color:var(--neon-green);color:#fff;background:rgba(0,255,136,0.12);border-radius:10px;';
          btn.textContent = txt;
          btn.onclick = () => sendBarrage('text', txt, null, false);
          recentTextsList.appendChild(btn);
        });
        recentTextsBox.style.display = 'block';
      }

      // 2. 加入過的貼圖圖片
      const imgs = getStoredItems('beat_recent_imgs_' + currentRoom);
      if (imgs.length > 0) {
        recentImgsList.innerHTML = '';
        imgs.forEach((imgData, i) => {
          const imgBtn = document.createElement('div');
          imgBtn.style.cssText = 'cursor:pointer;width:52px;height:52px;border-radius:10px;border:2px solid var(--neon-blue);overflow:hidden;background:#111;flex-shrink:0;box-shadow:0 2px 8px rgba(0,210,255,0.3);';
          imgBtn.title = '點擊再次發送到大螢幕';
          imgBtn.innerHTML = `<img src="${imgData}" style="width:100%;height:100%;object-fit:cover;" alt="貼圖${i+1}" />`;
          imgBtn.onclick = () => sendBarrage('image', imgData, null, false);
          recentImgsList.appendChild(imgBtn);
        });
        recentImgsBox.style.display = 'block';
      }
    }
    renderRecentSends();

    async function sendBarrage(type, content, customMsg = null, saveToHistory = false) {
      const sender = nameInput.value.trim();
      const sid = window.rosterManager ? window.rosterManager.sessionId : 'barrage_anon';
      try {
        const res = await fetch(`/api/barrage?room=${encodeURIComponent(currentRoom)}&sid=${encodeURIComponent(sid)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, content, sender })
        });
        const data = await res.json();
        if (data.disabled) {
          barrageStatus.textContent = '🛡️ 主持人目前已關閉干擾道具功能，改發 Emoji 應援吧！';
          return;
        }
        if (data.ok) {
          barrageStatus.textContent = customMsg || (type === 'text' ? `🚀 已發送文字：「${content}」` : `🚀 已發送到大螢幕！`);
          if (saveToHistory) {
            if (type === 'text') {
              saveStoredItem('beat_recent_texts_' + currentRoom, content);
              renderRecentSends();
            } else if (type === 'image') {
              saveStoredItem('beat_recent_imgs_' + currentRoom, content);
              renderRecentSends();
            }
          }
          return;
        }
      } catch (e) {}
      barrageStatus.textContent = '⚠️ 發送失敗，請確認主持人已啟動 node server.js';
    }

    document.querySelectorAll('.emoji-send-btn').forEach(btn => {
      btn.onclick = () => sendBarrage('emoji', btn.textContent.trim(), null, false);
    });

    // 快捷干擾文字按鈕點擊直接送出文字彈幕（不存入 recentTextsBox）
    document.querySelectorAll('.taunt-btn').forEach(btn => {
      btn.onclick = () => {
        const text = btn.dataset.text || btn.textContent.trim();
        sendBarrage('text', text, `📢 已向大螢幕發送干擾喊話：「${text}」`, false);
      };
    });

    // 綁定 4 種瑪利歐干擾道具，並自動同步後台是否開啟干擾功能
    const sabotageBtns = document.querySelectorAll('.sabotage-btn');
    const sabotageLabel = document.getElementById('sabotageLabel');
    sabotageBtns.forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.sabotage;
        sendBarrage('sabotage', key, `😈 已發動【${btn.textContent.trim()}】干擾大螢幕 3 秒！`, false);
      };
    });

    async function syncSabotageStatus() {
      try {
        const sid = window.rosterManager ? window.rosterManager.sessionId : 'sync_anon';
        const res = await fetch(`/api/barrage?room=${encodeURIComponent(currentRoom)}&sid=${encodeURIComponent(sid)}&since=0`);
        const data = await res.json();
        if (typeof data.sabotageEnabled === 'boolean') {
          sabotageBtns.forEach(b => {
            b.disabled = !data.sabotageEnabled;
            b.style.opacity = data.sabotageEnabled ? '1' : '0.4';
          });
          if (sabotageLabel) {
            sabotageLabel.textContent = data.sabotageEnabled
              ? '😈 趣味微干擾！發動 3 秒輕量道具：'
              : '🛡️ 主持人目前已關閉干擾道具（仍可發送 Emoji 與文字應援）';
          }
        }
      } catch (e) {}
    }
    syncSabotageStatus();
    setInterval(syncSabotageStatus, 3000);

    document.getElementById('btnSendText').onclick = () => {
      const txt = barrageTextInput.value.trim();
      if (!txt) return;
      sendBarrage('text', txt, null, true);
      barrageTextInput.value = '';
    };
    barrageTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnSendText').click();
    });

    document.getElementById('btnSendImg').onclick = () => barrageImgInput.click();
    barrageImgInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      barrageStatus.textContent = '⏳ 正在處理貼圖...';
      try {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const max = 160;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            sendBarrage('image', c.toDataURL('image/jpeg', 0.8), '🚀 貼圖已成功發送到大螢幕！', true);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      } catch (err) {
        barrageStatus.textContent = '❌ 圖片處理失敗';
      }
      barrageImgInput.value = '';
    };
  </script>
</body>
</html>
